rows:
- subject:
    kind: node
    node: g1
    check: g1-gate
  attempt: 1
  requirement: gate tests pass
  type: exec
  isolation:
    kind: na_exec
  fails_when: any test fails
  red_evidence:
    kind: assertion_failure
    test_path: tests/test_checkrows.py
    summary: 15 failed / 3 passed against stub
    stub_path: code/checkrows.py
  verdict: pass
  evidence:
    kind: exec
    command: python -m pytest tests/test_checkrows.py -q
    expected_exit: 0
    actual_exit: 0
    output: 18 passed
- subject:
    kind: node
    node: g3
    check: g3-review
  attempt: 1
  requirement: README documents every check
  type: review
  isolation:
    kind: fresh_subagent
    subagent: ab18228248301e74e
  fails_when: an implemented check has no entry under checks
  red_evidence:
    kind: mutant
    variant_path: README.mutant.md
    mutation: W7 entry under checks
  verdict: pass
  evidence:
    kind: excerpt
    sections:
    - section: usage
      verdict: pass
      excerpt: ''
    - section: checks
      verdict: pass
      excerpt: 'W7: a reads entry'
- subject:
    kind: acceptance
    item: c1
  attempt: 1
  requirement: both scripts exit 0 on clean
  type: exec
  isolation:
    kind: na_exec
  fails_when: either exits non-zero on clean
  red_evidence:
    kind: checks_baseline
    summary: "stubs exit 0 \u2014 green at baseline, kept jointly with c2"
  verdict: pass
  evidence:
    kind: exec
    command: bash integration.sh
    expected_exit: 0
    actual_exit: 0
    output: C1 pass
  exercises:
  - s-namematch
  - s-verdicts
- subject:
    kind: integration
  attempt: 1
  requirement: all acceptance items pass
  type: exec
  isolation:
    kind: na_exec
  fails_when: any item fails
  red_evidence:
    kind: checks_baseline
    summary: 29 failed / 5 passed
  verdict: pass
  evidence:
    kind: exec
    command: bash integration.sh
    expected_exit: 0
    actual_exit: 0
    output: all pass
