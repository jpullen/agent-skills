name: harness

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      tier:
        description: Harness tier
        type: choice
        options: [standard, full]
        default: full

permissions:
  contents: read

jobs:
  standard:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r harness/requirements.txt
      - run: python3 harness/run.py standard --json harness-standard.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: harness-standard
          path: harness-standard.json

  full:
    # The slow tier: on pull requests that touch the kit, and on demand.
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: kit
        if: github.event_name == 'pull_request'
        with:
          filters: |
            kit:
              - 'plugins/graph-prompt/**'
              - 'harness/**'
      - uses: actions/setup-python@v5
        if: github.event_name == 'workflow_dispatch' || steps.kit.outputs.kit == 'true'
        with:
          python-version: "3.12"
      - if: github.event_name == 'workflow_dispatch' || steps.kit.outputs.kit == 'true'
        run: pip install -r harness/requirements.txt
      - if: github.event_name == 'workflow_dispatch' || steps.kit.outputs.kit == 'true'
        run: python3 harness/run.py full --only "generated mutants" mutation --json harness-full.json
      - uses: actions/upload-artifact@v4
        if: always() && (github.event_name == 'workflow_dispatch' || steps.kit.outputs.kit == 'true')
        with:
          name: harness-full
          path: harness-full.json
